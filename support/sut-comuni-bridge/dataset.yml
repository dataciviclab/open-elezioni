root: "../../out"
schema_version: 1

dataset:
  name: "sut_comuni_bridge"
  source_id: "dait_sut"
  tags: [support, territorio, comuni, codici, istat, bridge]
  category: support
  description: "Bridge comuni: codici ISTAT/Belfiore/elettorale + regione/provincia normalizzate (SUT)."
  years: [2026]
  time_coverage: {start_year: 2026, end_year: 2026}

raw:
  output_policy: overwrite
  sources:
    - name: "sut_comuni_bridge"
      type: "script"
      args:
        command: "python preprocess.py raw_input.csv"
        output: "raw_input.csv"
        filename: "raw_input.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns:
    - comune
    - sigla
    - regione
    - provincia
    - codice_istat
    - codice_belfiore
    - codice_elettorale
    - comune_norm
    - provincia_norm
    - regione_norm
  read:
    source: auto
    mode: latest
    delim: ";"
    encoding: "utf-8"
    header: true
    all_varchar: true
  validate:
    primary_key: [codice_istat]
    not_null: [comune, sigla, regione, provincia, codice_istat, codice_belfiore]
    min_rows: 7000

mart:
  tables:
    - name: "mart_comuni"
      sql: "sql/mart_comuni.sql"
  required_tables:
    - "mart_comuni"
  validate:
    table_rules:
      mart_comuni:
        primary_key: [codice_istat]
        min_rows: 7000

validation:
  fail_on_error: true

output:
  artifacts: minimal
