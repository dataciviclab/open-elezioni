name: pipeline

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
    paths:
      - "datasets/**"
      - "support/**"
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      dataset:
        description: "Slug o path del dataset.yml (vuoto = tutti)"
        required: false
        default: ""

concurrency:
  group: pipeline-${{ github.event.pull_request.number || github.ref || 'schedule' }}
  cancel-in-progress: false

jobs:
  pipeline:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    uses: dataciviclab/.github/.github/workflows/pipeline-reusable.yml@main
    with:
      repo-slug: "${{ github.event.repository.name }}"
      run-command: ${{ inputs.dataset == '' && 'make run-all' || format('toolkit run --config {0}', inputs.dataset) }}
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    secrets: inherit
