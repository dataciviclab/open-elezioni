root: "../../out"
schema_version: 1

dataset:
  name: "elezioni_provinciali"
  source_id: "eligendo"
  tags: [politica, elezioni, provinciali]
  category: politica
  years: [2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011]
  time_coverage: {start_year: 2004, end_year: 2011}

support:
  - name: "sut_comuni"
    config: "../../support/sut-comuni-bridge/dataset.yml"
    years: [2026]

raw:
  output_policy: overwrite
  sources:
    - type: script
      args:
        command: "python preprocess.py {year} raw_input.csv"
        output: "raw_input.csv"
        filename: "raw_input.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns:
    - data_elezione
    - regione
    - provincia
    - collegio
    - comune
    - turno
    - lista
    - candidato
    - codice_istat
    - match_sut
  read:
    mode: latest
    source: auto
    delim: ";"
    encoding: "utf-8"
    header: true
    ignore_errors: true
    all_varchar: true
  validate:
    not_null: [data_elezione]
    min_rows: 100

mart:
  tables:
    - name: "mart_voti_lista_collegio"
      sql: "sql/mart.sql"
  required_tables:
    - "mart_voti_lista_collegio"
  validate:
    table_rules:
      mart_voti_lista_collegio:
        min_rows: 100

validation:
  fail_on_error: true

output:
  artifacts: minimal
